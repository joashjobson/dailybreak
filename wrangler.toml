# Cloudflare Worker for Daily Break. src/worker.js answers /api/check and runs friend duels (/api/duel); every other path is a file from public/.
# The name below must match the Worker's name in the Cloudflare dashboard exactly. Keep it the same in every version.
name = "daily-break"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/c/*"]

[observability.logs]
enabled = true

[vars]
# The answer checker says who is asking, with a way to contact you. Put your email here.
CONTACT_EMAIL = "joashjobson@gmail.com"
# Your site's address. Change it to https://yourdomain.app once you buy the domain.
SITE_URL = "https://daily-break.workers.dev"

# Saved answer checks, so each unknown name is only looked up once.
[[kv_namespaces]]
binding = "ANSWERS"
id = "9fbe1b6e275a466dbf84a9b546f25f50"

# Friend duels. Each invite code is its own little room that keeps the turns and the clock.
# Cloudflare creates this by itself on deploy; there's nothing to set up in the dashboard.
[[durable_objects.bindings]]
name = "DUELS"
class_name = "DuelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelRoom"]

# Daily scores (for "#3 of 41 today") and group leaderboards. One Board per day and one per group.
# Also made by Cloudflare on deploy. Never rename Board or change the v2 tag.
[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]
